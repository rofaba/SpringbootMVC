<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPagina}">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url('/images/yellow-mosaic.jpg');
            background-size: cover; background-attachment: fixed;
        }
        .form-container { background: white; padding: 30px; border: 2px solid #000; border-radius: 10px; margin-top: 50px; }
    </style>
</head>
<body class="container">

<div class="row justify-content-center">
    <div class="col-md-6 form-container shadow-lg">
        <h2 class="text-center mb-4" th:text="${tituloPagina}">Añadir Juego</h2>

        <form th:action="@{/juego/guardar}" th:object="${videojuego}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-bold">Título</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Plataforma</label>
                <select th:field="*{platform}" class="form-select">
                    <option value="PC">PC</option>
                    <option value="PlayStation 5">PlayStation 5</option>
                    <option value="Nintendo Switch">Nintendo Switch</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Año</label>
                <input type="number" th:field="*{year}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">URL de la Imagen</label>
                <input type="text" th:field="*{imageUrl}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Descripción</label>
                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-dark px-5">Guardar Cambios</button>
                <a href="/" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
