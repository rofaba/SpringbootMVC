<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de Juegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .game-card { border: 2px solid #000; padding: 20px; text-align: center; height: 100%; }
        .platform-bar { border-bottom: 2px solid #000; border-top: 2px solid #000; padding: 10px; margin-bottom: 20px; }
        .header-title { border: 2px solid #000; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body class="container mt-4">

<div class="text-center header-title">
    <h1>Biblioteca de Juegos</h1>
</div>

<div class="text-center py-3 border-bottom border-top mb-4">
    <a th:href="@{/}" class="mx-2">TODOS</a> |
    <a th:href="@{/plataforma/PC}" class="mx-2">PC</a> |
    <a th:href="@{/plataforma/PlayStation 5}" class="mx-2">PS5</a> |
    <a th:href="@{/plataforma/Nintendo Switch}" class="mx-2">SWITCH</a>
</div>

<h2 class="text-center mb-4"
    th:if="${plataformaSeleccionada != null}"
    th:text="${plataformaSeleccionada}">
    Nombre de la Plataforma
</h2>

<div class="row g-4">
</div>
<div class="row mt-4">
    <div class="col-md-4 mb-4" th:each="juego : ${juegos}">
        <div class="card h-100 text-center border-dark shadow-sm">
            <div class="card-body">
                <a th:href="@{/juego/{id}(id=${juego.id})}" class="text-decoration-none text-dark">
                    <h5 class="card-title fw-bold" th:text="${juego.title}">Nombre del Juego</h5>
                    <p class="card-text text-muted" th:text="${juego.platform}">Plataforma</p>
                </a>
            </div>
        </div>
    </div>
</div>
    <div class="col-12 text-center" th:if="${#lists.isEmpty(juegos)}">
        <p class="alert alert-warning">No se encontraron juegos para esta categoría.</p>
    </div>
</div>
<footer class="text-center mt-5 mb-3">
    Realizado por rofaba
</footer>

</body>
</html>
