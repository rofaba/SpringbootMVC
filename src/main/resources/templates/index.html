<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de Juegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
            url('/images/yellow-mosaic.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        /* Estilo contenido principal*/
        .main-content {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            border: 1px solid #000;
        }

        .header-container {
            border: 3px solid #000;
            padding: 40px;
            margin-bottom: 20px;
            background-color: #fff; /* Fondo sólido para el título */
        }

        .platform-bar {
            border-bottom: 2px solid #000;
            border-top: 2px solid #000;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        .game-card {
            border: 2px solid #000;
            padding: 20px;
            text-align: center;
            height: 100%;
            background-color: #fff;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: scale(1.03);
            box-shadow: 5px 5px 0px #000;
        }
    </style>
</head>
<body class="container mt-4">

<header class="header-container text-center">
    <h1 class="display-4 fw-bold">Biblioteca de Juegos</h1>
</header>

<nav class="text-center platform-bar">
    <a th:href="@{/}" class="mx-2 text-dark fw-bold text-decoration-none">TODOS</a> |
    <a th:href="@{/plataforma/PC}" class="mx-2 text-dark fw-bold text-decoration-none">PC</a> |
    <a th:href="@{/plataforma/PlayStation 5}" class="mx-2 text-dark fw-bold text-decoration-none">PS5</a> |
    <a th:href="@{/plataforma/Nintendo Switch}" class="mx-2 text-dark fw-bold text-decoration-none">SWITCH</a>
</nav>

<main class="main-content">
    <h2 class="text-center mb-4 text-uppercase fw-bold"
        th:if="${plataformaSeleccionada != null}"
        th:text="${plataformaSeleccionada}">
        Nombre de la Plataforma
    </h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="juego : ${juegos}">
            <div class="card game-card shadow-sm">
                <div class="card-body">
                    <a th:href="@{/juego/{id}(id=${juego.id})}" class="text-decoration-none text-dark">
                        <h5 class="card-title fw-bold" th:text="${juego.title}">Nombre del Juego</h5>
                        <p class="card-text text-muted" th:text="${juego.platform}">Plataforma</p>
                        <span class="badge bg-dark">Ver más</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-12 text-center" th:if="${#lists.isEmpty(juegos)}">
            <p class="alert alert-warning">No se encontraron juegos para esta categoría.</p>
        </div>
    </div>
</main>

<footer class="text-center mt-5 mb-3 fw-bold">
    <hr border="2">
    Realizado por rofaba
</footer>

</body>
</html>
